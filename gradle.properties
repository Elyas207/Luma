org.gradle.jvmargs=-Xmx6656M -Dfile.encoding=UTF-8
# The Kotlin daemon does not inherit org.gradle.jvmargs. Without this it runs on a default heap
# that :composeApp cannot be compiled in ("Not enough memory to run compilation").
kotlin.daemon.jvmargs=-Xmx6144M
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableR8.fullMode=true
kotlin.code.style=official

org.gradle.caching=true
org.gradle.configuration-cache=true
android.enableJetifier=false
android.nonTransitiveRClass=true